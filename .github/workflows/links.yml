name: Link Checker

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'

      - name: Build
        if: github.event_name == 'pull_request'
        run: hugo --minify --destination public/docs

      - name: Check Links (PR)
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir '${{ github.workspace }}/public'
            --remap 'https://cedardb.com/docs file://${{ github.workspace }}/public/docs'
            --include '^file://'
            --verbose --no-progress
            './public/**/*.html'

      - name: Collect Pages (Scheduled)
        if: github.event_name == 'schedule'
        run: |
          curl -fsSL https://cedardb.com/docs/sitemap.xml \
            | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' > pages.txt
          echo "Found $(wc -l < pages.txt) pages"
          test -s pages.txt

      - name: Check Links (Scheduled)
        if: github.event_name == 'schedule'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --verbose --no-progress --files-from pages.txt
